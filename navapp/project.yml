# XcodeGen spec: `xcodegen generate` turns this into NavTest.xcodeproj.
name: NavTest
options:
  bundleIdPrefix: local.pebblenav
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NavTest:
    type: application
    platform: iOS
    sources:
      - Sources/Core
      - Sources/App
      - path: Resources
        buildPhase: resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Nav Test
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # GPS keeps running while locked during a trip; that also keeps the
        # 127.0.0.1 server the Pebble watchapp polls alive.
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: Used to calculate the route and update directions during a trip you start. GPS stops when the trip ends.
        NSLocationAlwaysAndWhenInUseUsageDescription: Used to calculate the route and update directions during a trip you start. GPS stops when the trip ends.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.pebblenav.navtest
        TARGETED_DEVICE_FAMILY: "1"
